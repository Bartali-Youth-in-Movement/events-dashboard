<script>
(function () {
  "use strict";

  // ── Settings ───────────────────────────────────────────────────────────────
  // Where the events come from: the Apps Script Web app address of the Google Sheet
  // (it ends with /exec). Paste it between the quotes. Every visit reads the events
  // from the sheet through this address; nothing about the events is stored in this file.
  const DATA_URL = "https://script.google.com/macros/s/AKfycbwDK-MiUi_B8lEecIg5SkhNyfm5ia3jkEqMUGoVbuTIpdhwDnAGEGUsf9O4ryxt_sCgvQ/exec";

  // Israel's geographical regions: a GeoJSON file next to this page (see "Regions" below)
  const REGIONS_URL = "regions.geojson";
  // Multi-day events: put their routes in riding order (see "Riding order" below). Off for now;
  // adding ?order=auto to the page address shows it without switching it on for everyone.
  const AUTO_ORDER = true;
  const autoOrder = AUTO_ORDER || /[?&]order=auto(?:&|$)/.test(location.search);

  const ELE_THRESHOLD = 2; // metres, same as the sheet's calculation
  // Route colors from the Bartali palettes, deepened a little so they stand out on the map
  // (the 4th is teal, so no route looks like the navy outline of a region)
  const ROUTE_COLORS = ["#E8505A", "#2F7FD0", "#BB29BB", "#0E9384", "#D9874F", "#BF0D3E"];
  // Routes on the regular map, by their event's difficulty (and grey when it isn't given)
  const LEVEL_COLORS = { easy: "#16A34A", mid: "#2563EB", hard: "#DC2626", none: "#6B7785" };
  const levelColor = (ev) => LEVEL_COLORS[ev.levelCls] || LEVEL_COLORS.none;
  const LEVELS = [
    { key: "קל", cls: "easy" },
    { key: "בינוני", cls: "mid" },
    { key: "מאתגר", cls: "hard" },
  ];
  const SEASONS = ["סתיו", "חורף", "אביב", "קיץ"];
  const ISRAEL = [[29.45, 34.25], [33.35, 35.9]];

  // ── Small helpers ─────────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtKm = (v) => (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10).toLocaleString("he-IL");
  const fmtM = (v) => Math.round(v).toLocaleString("he-IL");
  const collator = new Intl.Collator("he");
  const longDate = new Intl.DateTimeFormat("he-IL", { day: "numeric", month: "long", year: "numeric" });
  // Light or dark right now, and the current value of a color from the stylesheet
  const deviceDark = window.matchMedia("(prefers-color-scheme: dark)");
  const activeTheme = () => document.documentElement.getAttribute("data-theme") || (deviceDark.matches ? "dark" : "light");
  const cssColor = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function parseDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function shortDate(d) {
    return d ? `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.${d.getFullYear()}` : "";
  }
  // School year (September–August) in Hebrew letters, e.g. 2025-11 → תשפ״ו
  function schoolYear(d) {
    if (!d) return "";
    const start = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;
    return gematria((start + 3761) % 1000);
  }
  function gematria(n) {
    const H = [[400, "ת"], [300, "ש"], [200, "ר"], [100, "ק"], [90, "צ"], [80, "פ"], [70, "ע"], [60, "ס"], [50, "נ"], [40, "מ"], [30, "ל"], [20, "כ"], [10, "י"], [9, "ט"], [8, "ח"], [7, "ז"], [6, "ו"], [5, "ה"], [4, "ד"], [3, "ג"], [2, "ב"], [1, "א"]];
    let out = "";
    while (n >= 400) { out += "ת"; n -= 400; }
    const tail = n % 100;
    if (tail === 15 || tail === 16) { n -= tail; }
    for (const [v, ch] of H) { while (n >= v) { out += ch; n -= v; } }
    if (tail === 15) out += "טו"; else if (tail === 16) out += "טז";
    return out.length === 1 ? out + "׳" : out.slice(0, -1) + "״" + out.slice(-1);
  }
  function hav(a, b) {
    const R = 6371, r = Math.PI / 180;
    const x = Math.sin((b[0] - a[0]) * r / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin((b[1] - a[1]) * r / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function niceStep(range, target) {
    const raw = range / Math.max(1, target);
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  }

  // ── Data preparation ─────────────────────────────────────────────────────
  function routeStats(pts) {
    let km = 0, up = 0, down = 0, last = pts[0][2];
    const cum = new Float64Array(pts.length);
    for (let i = 1; i < pts.length; i++) {
      km += hav(pts[i - 1], pts[i]);
      cum[i] = km;
      const dz = pts[i][2] - last;
      if (dz >= ELE_THRESHOLD) { up += dz; last = pts[i][2]; }
      else if (dz <= -ELE_THRESHOLD) { down -= dz; last = pts[i][2]; }
    }
    return { km, up, down, cum };
  }

  // How many days an event lasts: the sheet's "מספר ימים" column when it is filled in;
  // otherwise one day, or for a multi-day event the number in its name ("3 ימים", "דו יומי",
  // "יומיים"), else its lodging places + 1, else its number of routes, else 2.
  function explicitDays(e) {
    const set = Number(e.days);
    if (set >= 1) return Math.round(set);
    if (!e.multiDay) return 1;
    const name = e.name || "";
    const n = name.match(/(\d+)\s*ימים/);
    if (n && +n[1] >= 2) return +n[1];
    if (/תלת[\s-]?יומי/.test(name)) return 3;
    if (/דו[\s-]?יומי|יומיים/.test(name)) return 2;
    const nights = String(e.lodging || "").split(/[;\n]+/).map((x) => x.trim()).filter(Boolean).length;
    if (nights >= 1) return nights + 1;
    return 0;
  }
  function eventDays(e, routeCount) {
    const days = explicitDays(e);
    if (days) return days;
    if (routeCount >= 2) return routeCount;
    return 2;
  }
  const daysLabel = (d) => (d === 1 ? "יום אחד" : d === 2 ? "יומיים" : `${d} ימים`);

  // ── Regions ─────────────────────────────────────────────────────────────
  // Israel's geographical regions come from regions.geojson (REGIONS_URL), next to this page on the
  // website. The page also carries a copy (the "regionsBuiltIn" block above this script) for when
  // that file can't be read — for example when the page is opened straight from the computer.
  // An event belongs to the regions its routes pass through, worked out from the route points, so
  // nothing about regions has to be filled in the form or the sheet.
  let GEO = { features: [] }, REGIONS = [], regionById = {};
  function useGeography(gj) {
    GEO = gj;
    REGIONS = gj.features.filter((f) => f.properties && f.properties.kind === "region" && f.geometry).map((f) => {
      const p = f.properties, g = f.geometry;
      const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
      const poly = polys.map((rings) => rings.map((ring) => ring.map(([lng, lat]) => [lat, lng])));
      const pts = poly.flat(2);
      return {
        id: String(p.id), name: String(p.name || p.id), short: String(p.short || p.name || p.id), nudge: p.nudge === -1 ? -1 : 1,
        label: Array.isArray(p.label) ? [p.label[1], p.label[0]] : null,
        poly, count: 0,
        // bounding box [south, north, west, east], for a quick first check
        box: [Math.min(...pts.map((q) => q[0])), Math.max(...pts.map((q) => q[0])), Math.min(...pts.map((q) => q[1])), Math.max(...pts.map((q) => q[1]))],
      };
    });
    regionById = Object.fromEntries(REGIONS.map((r) => [r.id, r]));
  }
  async function loadGeography() {
    const builtIn = () => JSON.parse($("regionsBuiltIn").textContent);
    if (!/^https?:$/.test(location.protocol)) return builtIn();
    try {
      const res = await fetch(REGIONS_URL, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const gj = await res.json();
      if (!gj || !Array.isArray(gj.features) || !gj.features.some((f) => f.properties && f.properties.kind === "region")) throw new Error("no regions in it");
      return gj;
    } catch (e) {
      console.warn(`${REGIONS_URL} could not be read (${e.message}); using the regions built into the page.`);
      return builtIn();
    }
  }
  function inRegion(lat, lng, r) {
    if (lat < r.box[0] || lat > r.box[1] || lng < r.box[2] || lng > r.box[3]) return false;
    let c = false;
    for (const poly of r.poly) for (const ring of poly) {
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [yi, xi] = ring[i], [yj, xj] = ring[j];
        if ((yi > lat) !== (yj > lat) && lng < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) c = !c;
      }
    }
    return c;
  }
  // Distance in km from a point to a region's edge
  function edgeKm(lat, lng, r) {
    const ky = 111.2, kx = 111.2 * Math.cos(lat * Math.PI / 180);
    let best = Infinity;
    for (const poly of r.poly) for (const ring of poly) {
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const ax = (ring[j][1] - lng) * kx, ay = (ring[j][0] - lat) * ky, bx = (ring[i][1] - lng) * kx, by = (ring[i][0] - lat) * ky;
        const dx = bx - ax, dy = by - ay, len = dx * dx + dy * dy;
        const t = len ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len)) : 0;
        best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
      }
    }
    return best;
  }
  // The region a point is in. The outlines are drawn at country scale, so a point just off one
  // (on a beach, right on a border) counts for the nearest region up to 3 km away.
  function regionAt(lat, lng) {
    const hit = REGIONS.find((r) => inRegion(lat, lng, r));
    if (hit) return hit;
    let best = null, bestKm = 3;
    REGIONS.forEach((r) => { const d = edgeKm(lat, lng, r); if (d < bestKm) { bestKm = d; best = r; } });
    return best;
  }
  // The regions an event's routes pass through: at least 2 km of riding in the region, or a quarter
  // of the event's distance. One route can pass through several regions. Longest stretch first.
  function eventRegions(routes) {
    if (!REGIONS.length) return [];
    const km = {};
    let total = 0;
    routes.forEach((r) => {
      r.pts.forEach((p, i) => {
        const reg = i ? regionAt(p[0], p[1]) : null;
        if (!reg) return;
        const d = hav(r.pts[i - 1], p);
        km[reg.id] = (km[reg.id] || 0) + d;
        total += d;
      });
    });
    return Object.keys(km).filter((id) => km[id] >= 2 || km[id] >= total * 0.25).sort((a, b) => km[b] - km[a]);
  }

  // ── Riding order of a multi-day event's routes ──────────────────────────
  // The routes of a multi-day event come in the order they were submitted, which isn't always the
  // riding order. orderRoutes() works out the riding order from the routes themselves:
  //   names – every route's name has its day number ("יום 2", "day 3", "יום ב׳")
  //   times – every route was recorded on the ride (start and end times from its GPX points,
  //           published by the Apps Script), within ORDER_TIME_DAYS, one after the other
  //           without overlapping: they go by start time
  //   chain – the routes link end to start (each day starts where the previous one ended,
  //           within ORDER_JOIN_KM), in exactly one way. Routes that don't link go last.
  //   home  – one route starts at the riding centre's usual starting point; after it, each next
  //           route is the one starting clearly nearest to where the previous one ended
  //   kept  – none of these decides it: the submitted order is kept
  const ORDER_JOIN_KM = 3;   // a day "starts where the previous one ended" within this distance
  const ORDER_HOME_KM = 8;   // "starts at the riding centre" within this distance
  const ORDER_NEXT_KM = 30;  // the next day starts at most this far from where the last one ended…
  const ORDER_CLEAR_KM = 5;  // …and at least this much nearer than any other route
  const ORDER_TIME_DAYS = 10; // recorded times of one event's routes lie within this many days

  function dayNumber(name) {
    const s = String(name || "");
    const n = s.match(/(?:יום|day|d)\s*[-–_.]?\s*(\d{1,2})(?!\d)/i);
    if (n) return +n[1];
    const h = s.match(/יום\s*([א-י])\s*['׳"״]?(?=\s|$|[-–_.,)])/);
    return h ? "אבגדהוזחטי".indexOf(h[1]) + 1 : 0;
  }

  function orderRoutes(routes, home) {
    const n = routes.length;
    const ids = routes.map((_, i) => i);
    if (n < 2) return { order: ids, how: "single" };
    const days = routes.map((r) => dayNumber(r.name));
    if (days.every((d) => d > 0) && new Set(days).size === n) return { order: ids.slice().sort((a, b) => days[a] - days[b]), how: "names" };

    // Recorded times. Routes ridden at the same time (overlapping) are parallel groups, not days.
    const when = routes.map((r, i) => ({ i, s: Date.parse(r.start), e: Date.parse(r.end) }));
    if (when.every((w) => isFinite(w.s) && isFinite(w.e) && w.e >= w.s)) {
      when.sort((a, b) => a.s - b.s);
      const spread = when[n - 1].s - when[0].s <= ORDER_TIME_DAYS * 864e5;
      const oneAfterAnother = when.every((w, k) => k === 0 || w.s >= when[k - 1].e);
      if (spread && oneAfterAnother) return { order: when.map((w) => w.i), how: "times" };
    }

    const first = (i) => routes[i].pts[0], last = (i) => routes[i].pts[routes[i].pts.length - 1];
    const gap = ids.map((i) => ids.map((j) => (i === j ? Infinity : hav(last(i), first(j)))));

    // The longest chains of routes joined end to start
    if (n <= 9) {
      let best = [], bestLen = 0;
      const grow = (chain, used) => {
        let longer = false;
        for (const j of ids) {
          if (used[j] || gap[chain[chain.length - 1]][j] > ORDER_JOIN_KM) continue;
          longer = true;
          used[j] = true; chain.push(j);
          grow(chain, used);
          chain.pop(); used[j] = false;
        }
        if (!longer) {
          if (chain.length > bestLen) { bestLen = chain.length; best = [chain.slice()]; }
          else if (chain.length === bestLen) best.push(chain.slice());
        }
      };
      ids.forEach((i) => { const used = ids.map((j) => j === i); grow([i], used); });
      if (bestLen >= Math.max(2, Math.ceil(n / 2)) && best.length === 1) {
        const chain = best[0];
        return { order: chain.concat(ids.filter((i) => !chain.includes(i))), how: "chain", extra: ids.filter((i) => !chain.includes(i)) };
      }
    }

    // From the riding centre's usual starting point
    if (home) {
      const atHome = ids.filter((i) => hav(home, first(i)) <= ORDER_HOME_KM);
      if (atHome.length === 1) {
        const order = [atHome[0]];
        const left = new Set(ids.filter((i) => i !== atHome[0]));
        while (left.size) {
          const from = order[order.length - 1];
          const next = [...left].map((j) => [j, gap[from][j]]).sort((a, b) => a[1] - b[1]);
          if (next[0][1] > ORDER_NEXT_KM || (next.length > 1 && next[1][1] - next[0][1] < ORDER_CLEAR_KM)) break;
          order.push(next[0][0]);
          left.delete(next[0][0]);
        }
        if (!left.size) return { order, how: "home" };
      }
    }
    return { order: ids, how: "kept" };
  }

  // Each riding centre's usual starting point: where routes of at least 3 of its events start
  // (within 3 km of each other). Centres without one simply don't use the "home" rule.
  function centreHomes(events) {
    const byCentre = {};
    events.forEach((e) => {
      if (!e.center) return;
      (byCentre[e.center] = byCentre[e.center] || []).push((e.routes || []).filter((r) => r.pts && r.pts.length > 1).map((r) => r.pts[0]));
    });
    const homes = {};
    Object.entries(byCentre).forEach(([centre, starts]) => {
      let best = null, bestCount = 0;
      starts.flat().forEach((c) => {
        const count = starts.filter((list) => list.some((p) => hav(c, p) <= 3)).length;
        if (count > bestCount) { bestCount = count; best = c; }
      });
      if (bestCount >= 3) {
        const near = starts.flat().filter((p) => hav(best, p) <= 3);
        homes[centre] = [near.reduce((a, p) => a + p[0], 0) / near.length, near.reduce((a, p) => a + p[1], 0) / near.length];
      }
    });
    return homes;
  }

  function prepare(raw) {
    // Each riding centre's usual starting point, for putting multi-day routes in riding order
    const homes = autoOrder ? centreHomes(raw.events) : {};
    return raw.events.map((e, i) => {
      const date = parseDate(e.date);
      let list = (e.routes || []).filter((r) => r.pts && r.pts.length > 1);
      // A multi-day event's routes in riding order
      let ordered = false;
      if (autoOrder && e.multiDay && list.length > 1) {
        const res = orderRoutes(list, homes[e.center]);
        ordered = res.how !== "kept";
        list = res.order.map((k) => list[k]);
      }
      // In riding order, with as many routes as days: unnamed routes are named by their day
      const dayNames = ordered && explicitDays(e) === list.length;
      const routes = list.map((r, k) => {
        const s = routeStats(r.pts);
        return { name: r.name || (dayNames ? `יום ${k + 1}` : `מסלול ${k + 1}`), named: !!r.name, pts: r.pts, color: ROUTE_COLORS[k % ROUTE_COLORS.length], ...s };
      });
      const geo = eventRegions(routes);
      let stats = null, statsNote = "";
      if (routes.length === 1) {
        stats = { km: routes[0].km, up: routes[0].up, down: routes[0].down };
      } else if (routes.length > 1 && e.multiDay) {
        stats = routes.reduce((a, r) => ({ km: a.km + r.km, up: a.up + r.up, down: a.down + r.down }), { km: 0, up: 0, down: 0 });
        statsNote = `סה״כ ${routes.length} המסלולים של האירוע, בלי הדרך ביניהם.`;
      } else if (routes.length > 1) {
        const longest = routes.reduce((a, r) => (r.km > a.km ? r : a));
        stats = { km: longest.km, up: longest.up, down: longest.down };
        statsNote = `לאירוע ${routes.length} מסלולים. מוצג הארוך שבהם.`;
      }
      const level = LEVELS.find((l) => l.key === e.level);
      return {
        ...e,
        idx: i,
        slug: String(e.id), // the Submission ID: the event's address on the website (#…)
        oldSlug: "e-" + String(e.id).replace(/[^A-Za-z0-9]/g, "").slice(0, 8), // how addresses looked before
        dateObj: date,
        year: schoolYear(date),
        geo,
        ordered,
        levelCls: level ? level.cls : "none",
        routes,
        days: eventDays(e, routes.length),
        stats,
        statsNote,
        haystack: [e.name, e.center, e.staff, e.lodging, (e.groups || []).join(" "), geo.map((id) => regionById[id].name).join(" ")].join(" ").toLowerCase(),
      };
    });
  }

  // ── State ───────────────────────────────────────────────────────────────
  const state = {
    events: [],
    filtered: [],
    selected: null,
    focus: 0,
    picked: false, // one route of the open event was picked: the others fade
    sort: "new",
    bounds: { km: [0, 0], up: [0, 0] },
    f: null,
    view: "regions",       // "regions" (the landing view) or "map" (the regular map with routes)
    returnView: "regions", // where closing an event goes back to
    returnBounds: null,
  };
  const freshFilters = () => ({
    q: "", center: "", group: "", year: "", audience: "",
    level: "", seasons: new Set(), geo: "", days: "",
    km: state.bounds.km.slice(), up: state.bounds.up.slice(), routesOnly: false,
  });

  // ── Map ─────────────────────────────────────────────────────────────────
  // Two views on the same map:
  //   regions – the landing view: Israel's regions on a plain background, each one a button
  //   map     – a regular map with the routes; opens when a region or an event is chosen
  const canvas = L.canvas({ tolerance: 6 });
  const map = L.map("map", { zoomControl: false, renderer: canvas, minZoom: 6, zoomSnap: 0.25, maxBounds: [[28.5, 33], [34.2, 37]] });
  L.control.zoom({ position: "topleft", zoomInTitle: "התקרבות", zoomOutTitle: "התרחקות" }).addTo(map);
  map.attributionControl.setPrefix(false);

  // The regular map is OpenStreetMap. Its servers only send map tiles to pages that say which website
  // is asking, which a file opened from the computer can't do — so there (and wherever they refuse)
  // the regular map comes from Esri's street map instead.
  const onTheWeb = /^https?:$/.test(location.protocol);
  const STREETS = {
    osm: {
      url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
    },
    esri: {
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
      attribution: 'Esri · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
    },
  };
  const firstStreets = onTheWeb ? STREETS.osm : STREETS.esri;
  const normalMap = L.tileLayer(firstStreets.url, { maxZoom: 19, referrerPolicy: "strict-origin-when-cross-origin", attribution: firstStreets.attribution });
  function useEsriStreets() {
    if (normalMap.options.attribution === STREETS.esri.attribution) return;
    if (map.hasLayer(normalMap)) map.attributionControl.removeAttribution(normalMap.options.attribution).addAttribution(STREETS.esri.attribution);
    normalMap.options.attribution = STREETS.esri.attribution;
    normalMap.setUrl(STREETS.esri.url);
  }
  // On the web, check once that OpenStreetMap accepts this page (some privacy settings hide the website's address)
  if (onTheWeb) {
    fetch("https://tile.openstreetmap.org/7/76/52.png", { referrerPolicy: "strict-origin-when-cross-origin" })
      .then((res) => { if (res.status === 403) useEsriStreets(); })
      .catch(() => { /* couldn't check: keep OpenStreetMap */ });
  }
  // The hiking map comes from Mapeak, the successor of Israel Hiking Map (same team, same map).
  // While the old Israel Hiking Map address still works, any tile Mapeak can't send is taken from there.
  const hikingMap = L.tileLayer("https://mapeak.com/Hebrew/Tiles/{z}/{x}/{y}.png", {
    maxNativeZoom: 16, maxZoom: 18,
    attribution: '<a href="https://mapeak.com" target="_blank" rel="noopener">Mapeak</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
  });
  hikingMap.on("tileerror", (e) => {
    const tile = e.tile;
    if (tile.dataset.retried) return;
    tile.dataset.retried = "1";
    tile.src = tile.src.replace("https://mapeak.com/", "https://israelhiking.osm.org.il/");
  });
  const baseLayers = {
    "מפה רגילה": normalMap,
    "מפת טיולים": hikingMap,
    "תצלום אוויר": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19,
      attribution: "Esri, Maxar, Earthstar Geographics",
    }),
  };
  // Choosing a region opens the regular map; if the visitor switches to another one, that one is kept
  let baseLayer = normalMap;
  L.control.layers(baseLayers, null, { position: "topleft" }).addTo(map);
  map.on("baselayerchange", (e) => { baseLayer = e.layer; });
  // The whole country, leaving room at the top for the box over the map
  const israelView = { paddingTopLeft: [10, 52], paddingBottomRight: [10, 10] };
  map.fitBounds(ISRAEL, israelView);

  const hoverDot = L.circleMarker([0, 0], { radius: 6, color: "#0B2D45", weight: 2, fillColor: "#fff", fillOpacity: 1, interactive: false });

  // ── The regions map ─────────────────────────────────────────────────────
  // Land around Israel and the lakes (regions view only), the regions, and their name labels (buttons)
  map.createPane("land").style.zIndex = 150;
  map.createPane("regions").style.zIndex = 350;  // under the routes
  map.createPane("water").style.zIndex = 360;
  map.createPane("regionLabels").style.zIndex = 450;
  const backdrop = L.layerGroup();
  const backdropShapes = [];
  let hoverGeo = "";

  // ── Spotlight ──
  // On the regular map, the chosen region (or the regions an open event passes through) stays clear,
  // the rest of the map is covered with a soft veil, and a navy line with a white halo marks the edge.
  // The map underneath is light in both themes, so the outline is the same in both.
  map.createPane("veil").style.zIndex = 300;   // over the map tiles, under the routes
  map.createPane("focus").style.zIndex = 390;
  const FOCUS_LINE = "#01426A", FOCUS_HALO = "#FFFFFF";
  const WORLD = [[15, 20], [15, 50], [45, 50], [45, 20]];
  const veil = L.polygon([WORLD], { pane: "veil", renderer: L.svg({ pane: "veil" }), interactive: false, stroke: false, fillOpacity: 0.55 });
  const focusRenderer = L.svg({ pane: "focus" });
  const focusHalo = L.polygon([], { pane: "focus", renderer: focusRenderer, interactive: false, fill: false, color: FOCUS_HALO, weight: 7, opacity: 0.9 });
  const focusLine = L.polygon([], { pane: "focus", renderer: focusRenderer, interactive: false, fill: false, color: FOCUS_LINE, weight: 3, opacity: 1 });
  function showFocus() {
    const ids = state.view !== "map" || !state.f ? [] : state.selected ? state.selected.geo : state.f.geo ? [state.f.geo] : [];
    const rings = ids.filter((id) => regionById[id]).flatMap((id) => regionById[id].poly.map((part) => part[0]));
    const layers = [veil, focusHalo, focusLine];
    if (!rings.length) { layers.forEach((l) => { if (map.hasLayer(l)) map.removeLayer(l); }); return; }
    veil.setLatLngs([WORLD, ...rings]);
    focusHalo.setLatLngs(rings.map((r) => [r]));
    focusLine.setLatLngs(rings.map((r) => [r]));
    veil.setStyle({ fillColor: cssColor("--veil") });
    layers.forEach((l) => { if (!map.hasLayer(l)) l.addTo(map); });
    focusLine.bringToFront();
  }

  function drawGeography() {
    const renderers = { land: L.svg({ pane: "land" }), water: L.svg({ pane: "water" }), regions: L.svg({ pane: "regions" }) };
    GEO.features.forEach((f) => {
      const kind = f.properties && f.properties.kind;
      if (kind !== "land" && kind !== "water") return;
      const layer = L.geoJSON(f, {
        pane: kind, renderer: renderers[kind], interactive: false,
        attribution: kind === "land" ? 'גבולות: <a href="https://www.naturalearthdata.com" target="_blank" rel="noopener">Natural Earth</a>' : undefined,
      });
      backdropShapes.push({ layer, kind, under: !!f.properties.under });
      backdrop.addLayer(layer);
    });
    REGIONS.forEach((r) => {
      r.shape = L.polygon(r.poly, { pane: "regions", renderer: renderers.regions, interactive: false, smoothFactor: 0.5 }).addTo(map);
      r.bounds = r.shape.getBounds();
      r.marker = L.marker(r.label || r.bounds.getCenter(), {
        pane: "regionLabels", keyboard: false, riseOnHover: true,
        icon: L.divIcon({
          className: "rlabel-icon", iconSize: null,
          html: `<button type="button" class="rlabel" aria-pressed="false" title="${esc(r.name)}"><span class="t">${esc(r.short)}</span><span class="n num"></span></button>`,
        }),
      }).addTo(map);
      r.button = r.marker.getElement().querySelector(".rlabel");
      r.marker.on("click", () => chooseRegion(r.id));
      r.marker.on("mouseover", () => setHoverGeo(r.id));
      r.marker.on("mouseout", () => setHoverGeo(""));
    });
    const opts = $("fRegion");
    const northToSouth = REGIONS.slice().sort((a, b) => b.bounds.getCenter().lat - a.bounds.getCenter().lat);
    opts.innerHTML = `<option value="">כל הארץ</option>` + northToSouth.map((r) => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join("");
  }
  const regionUnder = (ll) => REGIONS.find((r) => inRegion(ll.lat, ll.lng, r)) || null;

  function styleGeography() {
    const land = cssColor("--land"), line = cssColor("--land-line"), sea = cssColor("--sea");
    backdropShapes.forEach(({ layer, kind, under }) => layer.setStyle(kind === "water"
      ? { stroke: false, fill: true, fillColor: sea, fillOpacity: 1 }
      : { stroke: !under, color: line, weight: 0.8, opacity: 1, fill: true, fillColor: land, fillOpacity: 1 }));
  }

  // Which view is showing: the regions map, or the regular map with the routes
  function setView(view) {
    state.view = REGIONS.length ? view : "map";
    const regionsView = state.view === "regions";
    map.getContainer().classList.toggle("mode-regions", regionsView);
    if (regionsView) {
      Object.values(baseLayers).forEach((l) => { if (map.hasLayer(l)) map.removeLayer(l); });
      if (!map.hasLayer(backdrop)) backdrop.addTo(map);
    } else {
      if (map.hasLayer(backdrop)) map.removeLayer(backdrop);
      if (!map.hasLayer(baseLayer)) baseLayer.addTo(map);
    }
  }

  // Choosing a region (on the map, its label, or the "אזור" dropdown) opens the regular map on that
  // region with the events whose routes pass through it. "" goes back to the regions map.
  function chooseRegion(id) {
    if (!state.f) return;
    if (state.selected) closeDetail(true, true);
    setHoverGeo("");
    state.f.geo = id;
    $("fRegion").value = id;
    setView(id ? "map" : "regions");
    apply(false);
    if (id) map.flyToBounds(regionById[id].bounds, { padding: [28, 28], maxZoom: 12, duration: 0.6 });
    else map.flyToBounds(ISRAEL, { ...israelView, duration: 0.6 });
  }
  // All the routes on the regular map, without choosing a region
  function showAllRoutes() {
    if (!state.f) return;
    setHoverGeo("");
    state.f.geo = "";
    $("fRegion").value = "";
    setView("map");
    apply(false);
    const b = routesBounds();
    map.flyToBounds(b.isValid() ? b : L.latLngBounds(ISRAEL), { padding: [30, 30], maxZoom: 13, duration: 0.6 });
  }
  function routesBounds() {
    const b = L.latLngBounds([]);
    state.filtered.forEach((ev) => ev.bounds && b.extend(ev.bounds));
    return b;
  }

  function setHoverGeo(id) {
    if (state.view !== "regions" || !state.f) id = "";
    if (id === hoverGeo) return;
    hoverGeo = id;
    map.getContainer().classList.toggle("over-region", !!id);
    styleRegions();
  }
  let moveFrame = 0, lastMove = null;
  map.on("mousemove", (e) => {
    // Over the map's own buttons (zoom, the region box) nothing is hovered
    lastMove = state.view === "regions" && !e.originalEvent.target.closest(".leaflet-control") ? e.latlng : null;
    if (moveFrame) return;
    moveFrame = requestAnimationFrame(() => {
      moveFrame = 0;
      const r = lastMove && regionUnder(lastMove);
      setHoverGeo(r ? r.id : "");
    });
  });
  map.on("mouseout movestart", () => { lastMove = null; setHoverGeo(""); });
  map.on("click", (e) => {
    if (state.view === "regions") {
      const r = regionUnder(e.latlng);
      if (r) chooseRegion(r.id);
    } else if (state.selected) {
      closeDetail(true);
    }
  });

  function styleRegions() {
    if (!REGIONS.length) return;
    const fill = cssColor("--region"), hot = cssColor("--region-hot"), empty = cssColor("--region-empty"), line = cssColor("--region-line");
    const geo = state.f ? state.f.geo : "";
    // Lit up: the region under the pointer, or the regions of the event pointed at in the list
    const lit = new Set(state.view === "regions" && hoverEv ? hoverEv.geo : []);
    if (hoverGeo) lit.add(hoverGeo);
    REGIONS.forEach((r) => {
      // On the regions map; on the regular map the spotlight shows the chosen region instead
      const dim = lit.size > 0 && !lit.has(r.id);
      r.shape.setStyle(state.view === "regions"
        ? { stroke: true, color: line, weight: 1.4, opacity: 1, fill: true, fillOpacity: dim ? 0.5 : 1,
            fillColor: lit.has(r.id) ? hot : state.f && !r.count ? empty : fill }
        : { stroke: false, fill: false });
      r.button.setAttribute("aria-pressed", String(geo === r.id));
      r.marker.getElement().classList.toggle("is-hover", lit.has(r.id));
      r.marker.getElement().classList.toggle("is-dim", dim);
    });
    layoutLabels();
  }

  // Labels that would cover each other: the busier region places its label first (the hovered one
  // always does); the next ones step aside a little — toward the sea for coastal regions, eastward
  // for the others — or hide until there's room. Labels show only on the regions map.
  function layoutLabels() {
    if (!REGIONS.length) return;
    const pane = map.getPane("regionLabels");
    const z = map.getZoom();
    pane.classList.toggle("z-small", z < 7.75);
    pane.classList.toggle("z-tiny", z < 7);
    pane.classList.toggle("is-off", state.view !== "regions");
    if (state.view !== "regions") return;
    const order = REGIONS.slice().sort((a, b) => (b.id === hoverGeo) - (a.id === hoverGeo) || b.count - a.count);
    const placed = [];
    order.forEach((r) => {
      const el = r.marker.getElement();
      const side = r.nudge;
      const tries = [[0, 0], [24 * side, 0], [0, -12], [0, 12], [24 * side, -12], [24 * side, 12]];
      el.classList.remove("is-crowded");
      const fits = tries.some(([dx, dy]) => {
        r.button.style.transform = dx || dy ? `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))` : "";
        const b = r.button.getBoundingClientRect();
        const box = [b.left - 3, b.top - 2, b.right + 3, b.bottom + 2];
        if (placed.some((p) => box[0] < p[2] && box[2] > p[0] && box[1] < p[3] && box[3] > p[1])) return false;
        placed.push(box);
        return true;
      });
      if (!fits) { r.button.style.transform = ""; el.classList.add("is-crowded"); }
    });
  }
  map.on("zoomend", layoutLabels);

  // Event counts on the labels and in the dropdown, under the other filters
  function showRegionCounts() {
    const opts = [...$("fRegion").options];
    REGIONS.forEach((r) => {
      r.button.querySelector(".n").textContent = r.count;
      r.button.classList.toggle("zero", r.count === 0);
      r.button.setAttribute("aria-label", `${r.name}: ${r.count === 1 ? "אירוע אחד" : r.count + " אירועים"}`);
      const o = opts.find((x) => x.value === r.id);
      if (o) o.textContent = `${r.name} (${r.count})`;
    });
  }

  // The box at the top of the map: on the regions map a hint (and all the routes at once);
  // on the regular map, what is showing and the way back to the regions map
  const RegionBox = L.Control.extend({
    options: { position: "topright" },
    onAdd() {
      const el = L.DomUtil.create("div", "region-box");
      el.hidden = true; // until the events have loaded
      L.DomEvent.disableClickPropagation(el);
      L.DomEvent.disableScrollPropagation(el);
      el.addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (b && b.dataset.act === "all") showAllRoutes();
        if (b && b.dataset.act === "back") chooseRegion("");
      });
      return el;
    },
  });
  const regionBox = new RegionBox().addTo(map);
  function renderRegionBox() {
    const el = regionBox.getContainer();
    el.hidden = !state.f || !REGIONS.length || (!!state.selected && state.view === "map");
    if (el.hidden) return;
    const geo = state.f.geo;
    const n = state.filtered.filter((e) => e.routes.length).length;
    const count = n === 1 ? "אירוע אחד" : `${n} אירועים`;
    el.innerHTML = state.view === "regions"
      ? `<span class="rb-hint">בחרו אזור במפה</span><button type="button" class="rb-btn" data-act="all">כל המסלולים</button>`
      : `<span class="rb-name">${esc(geo ? regionById[geo].name : "כל הארץ")}</span><span class="rb-count">${geo ? count : count + " במפה"}</span><button type="button" class="rb-btn" data-act="back">→ מפת האזורים</button>`;
  }

  // Which color is which difficulty: on the regular map, while no event is open
  const Legend = L.Control.extend({
    options: { position: "bottomleft" },
    onAdd() {
      const el = L.DomUtil.create("div", "level-legend");
      el.hidden = true;
      el.setAttribute("aria-label", "צבעי המסלולים לפי רמה טכנית");
      el.innerHTML = LEVELS.map((l) => `<span><span class="blaze" style="background:${LEVEL_COLORS[l.cls]}" aria-hidden="true"></span>${esc(l.key)}</span>`).join("");
      L.DomEvent.disableClickPropagation(el);
      return el;
    },
  });
  const legend = new Legend().addTo(map);

  // ── Routes ──────────────────────────────────────────────────────────────
  function buildLayers(ev) {
    if (!ev.routes.length) return;
    const group = L.featureGroup();
    ev.lines = ev.routes.map((r, k) => {
      const latlngs = r.pts.map((p) => [p[0], p[1]]);
      const casing = L.polyline(latlngs, { color: "#fff", weight: 6, opacity: 0.9, interactive: false });
      const line = L.polyline(latlngs, { color: levelColor(ev), weight: 3.5, opacity: 0.95 });
      line.bindTooltip("", { sticky: true, direction: "top", className: "route-tip", offset: [0, -6] });
      line.on("tooltipopen", () => line.setTooltipContent(esc(state.selected === ev && ev.routes.length > 1 ? r.name : ev.name)));
      line.on("click", (e) => { L.DomEvent.stop(e); if (state.selected === ev) focusRoute(k, true); else select(ev, true); });
      line.on("mouseover", () => setHoverEv(ev));
      line.on("mouseout", () => setHoverEv(null));
      group.addLayer(casing).addLayer(line);
      return { casing, line };
    });
    const start = ev.routes[0].pts[0];
    ev.startDot = L.circleMarker([start[0], start[1]], { radius: 4.5, color: "#fff", weight: 2, fillColor: levelColor(ev), fillOpacity: 1 });
    ev.startDot.on("click", (e) => { L.DomEvent.stop(e); select(ev, true); });
    ev.startDot.bindTooltip(esc(ev.name), { direction: "top", className: "route-tip", offset: [0, -6] });
    group.addLayer(ev.startDot);
    ev.group = group;
    ev.bounds = group.getBounds();
  }

  // On the regular map only the routes that fit what was chosen (the region and the filters) are
  // drawn, each in the color of its event's difficulty. An open event shows in its own route
  // colors, the others in grey.
  let hoverEv = null;
  const lookOf = (ev) => (state.selected ? (state.selected === ev ? "open" : "other") : ev === hoverEv ? "hover" : "match");
  function paint(ev, look) {
    const quiet = cssColor("--route-quiet"), halo = cssColor("--halo");
    ev.lines.forEach((l, k) => {
      if (look === "open") {
        const focused = ev.routes.length > 1 && state.focus === k;
        const faded = ev.routes.length > 1 && state.picked && !focused;
        l.line.setStyle({ color: ev.routes[k].color, weight: focused ? 6 : faded ? 3.5 : 4.5, opacity: faded ? 0.4 : 0.95 });
        l.casing.setStyle({ color: halo, weight: focused ? 9 : faded ? 5.5 : 7.5, opacity: faded ? 0.35 : 0.9 });
      } else if (look === "other") {
        l.line.setStyle({ color: quiet, weight: 2.5, opacity: 0.45 });
        l.casing.setStyle({ color: halo, weight: 4, opacity: 0.4 });
      } else {
        const big = look === "hover";
        l.line.setStyle({ color: levelColor(ev), weight: big ? 5.5 : 4, opacity: 0.95 });
        l.casing.setStyle({ color: halo, weight: big ? 8.5 : 6.5, opacity: 0.9 });
      }
    });
    ev.startDot.setStyle({ color: halo, fillColor: look === "open" ? ev.routes[0].color : look === "other" ? quiet : levelColor(ev), radius: look === "other" ? 3.5 : 4.5 });
  }
  const bringUp = (ev) => {
    ev.lines.forEach((l) => { l.casing.bringToFront(); l.line.bringToFront(); });
    ev.startDot.bringToFront();
  };
  function styleRoutes() {
    if (!state.f) return;
    state.events.forEach((ev) => { if (ev.group && map.hasLayer(ev.group)) paint(ev, lookOf(ev)); });
    const sel = state.selected;
    if (sel && sel.lines && map.hasLayer(sel.group)) {
      bringUp(sel);
      if (sel.lines[state.focus]) { sel.lines[state.focus].casing.bringToFront(); sel.lines[state.focus].line.bringToFront(); }
    }
  }

  // Pointing at a route on the map or a card in the list: on the regular map that route lights up;
  // on the regions map, the regions it passes through do
  function setHoverEv(ev) {
    if (state.selected || !state.f) return;
    if (ev && !ev.lines) ev = null;
    if (ev === hoverEv) return;
    const prev = hoverEv;
    hoverEv = ev;
    if (state.view === "regions") styleRegions();
    else {
      if (prev && map.hasLayer(prev.group)) paint(prev, lookOf(prev));
      if (ev && map.hasLayer(ev.group)) { paint(ev, "hover"); bringUp(ev); }
    }
    document.querySelectorAll(".card.is-hover").forEach((c) => c.classList.remove("is-hover"));
    const card = ev && document.querySelector(`.card[data-idx="${ev.idx}"]`);
    if (card) card.classList.add("is-hover");
  }

  function drawMap(fit) {
    const onMap = state.view === "map";
    const shown = new Set(state.filtered);
    // An event opened from the regions map shows alone; opened from the regular map, the others stay in grey
    const others = !state.selected || state.returnView === "map";
    state.events.forEach((ev) => {
      if (!ev.group) return;
      const want = onMap && (ev === state.selected || (others && shown.has(ev)));
      if (want && !map.hasLayer(ev.group)) ev.group.addTo(map);
      if (!want && map.hasLayer(ev.group)) map.removeLayer(ev.group);
    });
    styleRoutes();
    styleRegions();
    showFocus();
    renderRegionBox();
    legend.getContainer().hidden = !onMap || !!state.selected || !state.filtered.some((ev) => ev.routes.length);
    // All the routes (no region): follow the filters
    if (fit && onMap && !state.selected && !state.f.geo) {
      const b = routesBounds();
      if (b.isValid()) map.flyToBounds(b, { padding: [30, 30], maxZoom: 13, duration: 0.6 });
    }
  }

  // ── Filters ─────────────────────────────────────────────────────────────
  // ignoreGeo: everything but the region, for counting the events in each region
  function passes(ev, f, ignoreGeo) {
    if (f.q && !ev.haystack.includes(f.q)) return false;
    if (f.center && ev.center !== f.center) return false;
    if (f.group && !(ev.groups || []).includes(f.group)) return false;
    if (f.year && ev.year !== f.year) return false;
    if (f.audience && ev.audience !== f.audience) return false;
    if (f.level && ev.level !== f.level) return false;
    if (f.seasons.size && !(ev.seasons || []).some((s) => f.seasons.has(s))) return false;
    if (f.geo && !ignoreGeo && !ev.geo.includes(f.geo)) return false;
    if (f.days && ev.days !== f.days) return false;
    if (f.routesOnly && !ev.routes.length) return false;
    const kmFull = f.km[0] <= state.bounds.km[0] && f.km[1] >= state.bounds.km[1];
    const upFull = f.up[0] <= state.bounds.up[0] && f.up[1] >= state.bounds.up[1];
    if (!ev.stats) return kmFull && upFull;
    if (ev.stats.km < f.km[0] - 1e-9 || ev.stats.km > f.km[1] + 1e-9) return false;
    if (ev.stats.up < f.up[0] - 1e-9 || ev.stats.up > f.up[1] + 1e-9) return false;
    return true;
  }

  function activeFilterCount(f) {
    let n = 0;
    ["center", "group", "year", "audience", "level", "days", "geo"].forEach((k) => { if (f[k]) n++; });
    n += f.seasons.size ? 1 : 0;
    if (f.km[0] > state.bounds.km[0] || f.km[1] < state.bounds.km[1]) n++;
    if (f.up[0] > state.bounds.up[0] || f.up[1] < state.bounds.up[1]) n++;
    if (f.routesOnly) n++;
    return n;
  }

  function sortEvents(list) {
    const byDate = (a, b) => (b.dateObj ? b.dateObj.getTime() : -Infinity) - (a.dateObj ? a.dateObj.getTime() : -Infinity);
    const s = state.sort;
    return list.slice().sort((a, b) => {
      if (s === "old") return -byDate(a, b) || collator.compare(a.name, b.name);
      if (s === "km") return (b.stats ? b.stats.km : -1) - (a.stats ? a.stats.km : -1);
      if (s === "up") return (b.stats ? b.stats.up : -1) - (a.stats ? a.stats.up : -1);
      return byDate(a, b) || collator.compare(a.name, b.name);
    });
  }

  let fitTimer = 0;
  function apply(fit) {
    const f = state.f;
    state.filtered = sortEvents(state.events.filter((ev) => passes(ev, f)));
    REGIONS.forEach((r) => { r.count = 0; });
    state.events.forEach((ev) => { if (passes(ev, f, true)) ev.geo.forEach((id) => { if (regionById[id]) regionById[id].count++; }); });
    showRegionCounts();
    renderList();
    const n = activeFilterCount(f);
    $("filterCount").hidden = n === 0;
    $("filterCount").textContent = n;
    $("resetBtn").hidden = n === 0 && !f.q;
    clearTimeout(fitTimer);
    fitTimer = setTimeout(() => drawMap(fit), fit ? 250 : 0);
  }

  function fillSelect(el, label, values) {
    el.innerHTML = `<option value="">${esc(label)}</option>` + values.map((v) => `<option>${esc(v)}</option>`).join("");
  }

  function chipGroup(el, items, onToggle) {
    el.innerHTML = items.map((it, i) =>
      `<button type="button" class="chip" aria-pressed="false" data-i="${i}">${it.icon || ""}${esc(it.label)}</button>`).join("");
    el.addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if (!b) return;
      onToggle(items[+b.dataset.i], b);
    });
  }

  function dualRange(el, label, unit, step, key) {
    const [lo, hi] = state.bounds[key];
    el.innerHTML = `
      <div class="range-head"><span class="flabel">${esc(label)}</span><span class="range-val num" id="${key}Val"></span></div>
      <div class="dual"><span class="fill" id="${key}Fill"></span>
        <input type="range" id="${key}Min" min="${lo}" max="${hi}" step="${step}" value="${lo}" aria-label="${esc(label)} מינימום">
        <input type="range" id="${key}Max" min="${lo}" max="${hi}" step="${step}" value="${hi}" aria-label="${esc(label)} מקסימום">
      </div>`;
    const a = $(key + "Min"), b = $(key + "Max");
    const sync = (from) => {
      let x = +a.value, y = +b.value;
      if (x > y) { if (from === a) y = x; else x = y; a.value = x; b.value = y; }
      state.f[key] = [x, y];
      const span = hi - lo || 1;
      $(key + "Fill").style.left = ((x - lo) / span) * 100 + "%";
      $(key + "Fill").style.right = (100 - ((y - lo) / span) * 100) + "%";
      $(key + "Val").innerHTML = `<span dir="ltr">${fmtM(x)}–${fmtM(y)}</span> ${unit}`;
    };
    a.addEventListener("input", () => { sync(a); apply(true); });
    b.addEventListener("input", () => { sync(b); apply(true); });
    el.reset = () => { a.value = lo; b.value = hi; sync(a); };
    sync(a);
  }

  function setupFilters() {
    const ev = state.events;
    const uniq = (arr) => [...new Set(arr.filter(Boolean))];
    fillSelect($("fCenter"), "כל המרכזים", uniq(ev.map((e) => e.center)).sort(collator.compare));
    fillSelect($("fGroup"), "כל הקבוצות", uniq(ev.flatMap((e) => e.groups || [])).sort(collator.compare));
    const years = uniq(ev.filter((e) => e.dateObj).sort((a, b) => b.dateObj - a.dateObj).map((e) => e.year));
    fillSelect($("fYear"), "כל השנים", years);
    fillSelect($("fAudience"), "כולם", uniq(ev.map((e) => e.audience)).sort(collator.compare));

    [["fCenter", "center"], ["fGroup", "group"], ["fYear", "year"], ["fAudience", "audience"]].forEach(([id, k]) => {
      $(id).addEventListener("change", (e) => { state.f[k] = e.target.value; apply(true); });
    });

    // Technical level: one at a time. Choosing another replaces it; choosing it again clears it.
    chipGroup($("fLevels"), LEVELS.map((l) => ({ label: l.key, value: l.key, icon: `<span class="blaze ${l.cls}" aria-hidden="true"></span>` })), (it, b) => {
      const on = state.f.level !== it.value;
      state.f.level = on ? it.value : "";
      $("fLevels").querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", String(on));
      apply(true);
    });
    const seasonsInData = SEASONS.filter((s) => ev.some((e) => (e.seasons || []).includes(s)));
    chipGroup($("fSeasons"), seasonsInData.map((s) => ({ label: s, value: s })), (it, b) => toggleSet(state.f.seasons, it.value, b));
    // Regions: the same choice as clicking a region on the map (the options are made with the regions)
    $("fRegion").addEventListener("change", (e) => chooseRegion(e.target.value));
    // Duration: every number of days that appears in the events
    const dayCounts = uniq(ev.map((e) => e.days)).sort((a, b) => a - b);
    $("fDays").innerHTML = `<option value="">הכול</option>` + dayCounts.map((d) => `<option value="${d}">${esc(daysLabel(d))}</option>`).join("");
    $("fDays").addEventListener("change", (e) => { state.f.days = e.target.value ? Number(e.target.value) : ""; apply(true); });

    dualRange($("rKm"), "מרחק רכיבה", "ק״מ", 1, "km");
    dualRange($("rUp"), "טיפוס מצטבר", "מ׳", 50, "up");

    $("fRoutesOnly").addEventListener("change", (e) => { state.f.routesOnly = e.target.checked; apply(true); });

    let qTimer = 0;
    $("q").addEventListener("input", (e) => {
      clearTimeout(qTimer);
      qTimer = setTimeout(() => { state.f.q = e.target.value.trim().toLowerCase(); apply(true); }, 150);
    });
    $("sort").addEventListener("change", (e) => { state.sort = e.target.value; apply(false); });
    $("filterToggle").addEventListener("click", (e) => {
      const open = $("filters").hidden;
      $("filters").hidden = !open;
      e.currentTarget.setAttribute("aria-expanded", String(open));
    });
    $("resetBtn").addEventListener("click", resetFilters);
    $("emptyReset").addEventListener("click", resetFilters);
  }

  function toggleSet(set, value, btn) {
    if (set.has(value)) set.delete(value); else set.add(value);
    btn.setAttribute("aria-pressed", String(set.has(value)));
    apply(true);
  }

  function resetFilters() {
    const wasOnMap = state.view === "map";
    state.f = freshFilters();
    setView("regions");
    $("q").value = "";
    ["fCenter", "fGroup", "fYear", "fAudience", "fDays", "fRegion"].forEach((id) => { $(id).value = ""; });
    document.querySelectorAll("#filters .chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
    $("fRoutesOnly").checked = false;
    $("rKm").reset();
    $("rUp").reset();
    apply(true);
    if (wasOnMap) map.flyToBounds(ISRAEL, { ...israelView, duration: 0.6 });
  }

  // ── List ────────────────────────────────────────────────────────────────
  function renderList() {
    const list = state.filtered;
    const total = state.events.length;
    const km = list.reduce((a, e) => a + (e.stats ? e.stats.km : 0), 0);
    const withRoutes = list.filter((e) => e.routes.length).length;
    const region = state.f.geo ? regionById[state.f.geo] : null;
    $("summary").innerHTML = (region ? `<span class="where">${esc(region.name)}</span> · ` : "") + (list.length === total
      ? `<b>${total}</b> אירועים · ${withRoutes} עם מסלול במפה · <span class="num">${fmtKm(km)}</span> ק״מ`
      : `<b>${list.length}</b> מתוך ${total} אירועים · ${withRoutes} עם מסלול · <span class="num">${fmtKm(km)}</span> ק״מ`);
    $("empty").hidden = list.length > 0;
    $("emptyText").textContent = region && !region.count ? "עוד אין אירוע שהמסלול שלו עובר באזור הזה." : "אין אירועים שמתאימים לסינון.";
    $("list").innerHTML = list.map((e) => {
      const meta = [shortDate(e.dateObj), e.year, e.center].filter(Boolean).map(esc).join(" · ");
      const stats = e.stats
        ? `<span class="km num">${fmtKm(e.stats.km)} ק״מ</span><span class="num">↑${fmtM(e.stats.up)} מ׳</span>`
        : "";
      const tags = [
        e.days > 1 ? `<span class="card-tag">${esc(daysLabel(e.days))}</span>` : "",
        e.routes.length ? "" : `<span class="card-tag muted">ללא מסלול במפה</span>`,
      ].join(" ");
      return `<li><button class="card" data-idx="${e.idx}">
          <span class="blaze ${e.levelCls}" title="${esc(e.level || "רמה לא צוינה")}"></span>
          <span><span class="card-title">${esc(e.name)}</span><span class="card-meta">${meta}</span>${tags.trim() ? `<span>${tags}</span>` : ""}</span>
          <span class="card-stats">${stats}</span>
        </button></li>`;
    }).join("");
  }

  $("list").addEventListener("click", (e) => {
    const b = e.target.closest(".card");
    if (b) select(state.events[+b.dataset.idx], true);
  });
  $("list").addEventListener("mouseover", (e) => {
    const b = e.target.closest(".card");
    setHoverEv(b ? state.events[+b.dataset.idx] : null);
  });
  $("list").addEventListener("mouseleave", () => setHoverEv(null));

  // ── Detail ──────────────────────────────────────────────────────────────
  let listScroll = 0;
  function select(ev, push) {
    if (!ev) return;
    if (!state.selected) {
      listScroll = $("sideScroll").scrollTop;
      state.returnView = state.view;
      state.returnBounds = map.getBounds();
    }
    state.selected = ev;
    hoverEv = null;
    hoverGeo = "";
    map.getContainer().classList.remove("over-region");
    document.querySelectorAll(".card.is-hover").forEach((c) => c.classList.remove("is-hover"));
    state.focus = ev.routes.length ? ev.routes.reduce((best, r, k, all) => (r.km > all[best].km ? k : best), 0) : 0;
    if (ev.multiDay) state.focus = 0;
    state.picked = false;
    renderDetail(ev);
    $("listView").hidden = true;
    $("detailView").hidden = false;
    $("sideScroll").scrollTop = 0;
    if (ev.routes.length) setView("map"); // an event with a route opens on the regular map
    drawMap(false);
    showProfile(ev);
    if (ev.bounds) map.flyToBounds(ev.bounds, { ...fitPadding(), maxZoom: 15, duration: 0.6 });
    if (push && location.hash !== hashOf(ev)) setAddress(hashOf(ev));
    $("detailView").querySelector(".back").focus({ preventScroll: true });
  }

  // stay: don't go back to the earlier view (something else is about to be shown)
  function closeDetail(push, stay) {
    if (!state.selected) return;
    state.selected = null;
    $("detailView").hidden = true;
    $("listView").hidden = false;
    $("sideScroll").scrollTop = listScroll;
    hideProfile();
    if (!stay) {
      const back = state.view !== state.returnView || state.returnView === "map";
      setView(state.returnView);
      if (back && state.returnView === "regions") map.flyToBounds(ISRAEL, { ...israelView, duration: 0.6 });
      else if (back && state.returnBounds) map.flyToBounds(state.returnBounds, { duration: 0.6 });
    }
    drawMap(false);
    if (push && location.hash) setAddress(location.pathname + location.search);
  }

  function renderDetail(ev) {
    const when = ev.dateObj ? `${longDate.format(ev.dateObj)} · שנת ${ev.year}` : "תאריך לא צוין";
    const level = LEVELS.find((l) => l.key === ev.level);
    const tags = [
      level ? `<span class="tag"><span class="blaze ${level.cls}" aria-hidden="true"></span>${esc(level.key)}</span>` : "",
      ...(ev.groups || []).map((g) => `<span class="tag">${esc(g)}</span>`),
      ev.days > 1 ? `<span class="tag">${esc(daysLabel(ev.days))}</span>` : "",
      ...(ev.seasons || []).map((s) => `<span class="tag">${esc(s)}</span>`),
      ...ev.geo.map((id) => `<span class="tag">${esc(regionById[id].name)}</span>`),
    ].join("");

    const statsHtml = ev.stats ? `
      <div class="stats">
        <div class="stat"><span class="v num">${fmtKm(ev.stats.km)}<small>ק״מ</small></span><span class="k">מרחק רכיבה</span></div>
        <div class="stat"><span class="v num">${fmtM(ev.stats.up)}<small>מ׳</small></span><span class="k">טיפוס מצטבר</span></div>
        <div class="stat"><span class="v num">${fmtM(ev.stats.down)}<small>מ׳</small></span><span class="k">ירידה מצטברת</span></div>
      </div>${ev.statsNote ? `<p class="stats-note">${esc(ev.statsNote)}</p>` : ""}`
      : `<p class="no-route">לאירוע הזה עוד לא נשמר מסלול במפה.</p>`;

    // With the riding order on, each route also gets its own GPX download
    const perRoute = autoOrder && ev.routes.length > 1;
    const pressed = (k) => state.focus === k && (state.picked || !ev.multiDay);
    const routesHtml = ev.routes.length > 1 ? `
      <div>
        <h3 class="section-title">${ev.multiDay && (!autoOrder || ev.ordered) ? "המסלולים לפי הסדר" : "המסלולים באירוע"}</h3>
        <ul class="routes">${ev.routes.map((r, k) => `
          <li class="route-row"><button class="route" data-k="${k}" aria-pressed="${pressed(k)}">
            <span class="swatch" style="background:${r.color}"></span>
            <span>${esc(r.name)}</span>
            <span class="rs num">${fmtKm(r.km)} ק״מ · ↑${fmtM(r.up)}</span>
          </button>${perRoute ? `<button type="button" class="route-gpx" data-gpx="${k}" title="הורדת קובץ GPX של ${esc(r.name)}" aria-label="הורדת קובץ GPX של ${esc(r.name)}">GPX</button>` : ""}</li>`).join("")}
        </ul>
      </div>` : "";

    const facts = [
      ["מרכז רכיבה", ev.center],
      ["צוות", ev.staff],
      ["קהל יעד", ev.audience],
      ["לינה", ev.lodging],
    ].filter(([, v]) => v);

    // Old Israel Hiking Map share links open the same route on Mapeak
    const links = (ev.ihm || [])
      .map((u) => u.replace(/^https?:\/\/israelhiking\.osm\.org\.il\/share\//i, "https://mapeak.com/share/"))
      .filter((u, i, all) => all.indexOf(u) === i)
      .map((u, i, all) =>
        `<a class="action" href="${esc(u)}" target="_blank" rel="noopener">פתיחה ב־Mapeak${all.length > 1 ? " " + (i + 1) : ""}</a>`).join("");
    const gpx = ev.routes.length ? `<button class="action ghost" id="gpxBtn" type="button">הורדת קובץ GPX</button>` : "";

    // Every link from the sheet: safety file, the GPX files as uploaded, and map-view links
    const web = (list) => (list || []).filter((u) => /^https?:\/\//i.test(u));
    const gpxLabel = (u) => (/drive\.google\.com\/(drive\/)?(u\/\d+\/)?folders\//i.test(u) ? "תיקייה ב־Drive" : /drive\.google\.com|docs\.google\.com/i.test(u) ? "קובץ ב־Drive" : "קובץ GPX");
    const linkList = (list, label) => {
      const labels = list.map(label);
      return list.map((u, i) => {
        const same = labels.filter((l) => l === labels[i]).length;
        const n = labels.slice(0, i + 1).filter((l) => l === labels[i]).length;
        return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(labels[i])}${same > 1 ? " " + n : ""}</a>`;
      }).join("");
    };
    const linkRows = [
      ["תיק בטיחות", web(ev.safety), () => "תיק הבטיחות"],
      ["קובצי GPX", web(ev.gpxLinks), gpxLabel],
      ["מיקום במפה", web(ev.mapLinks).map((u) => u.replace(/^https?:\/\/(www\.)?israelhiking\.osm\.org\.il\//i, "https://mapeak.com/")), () => "מיקום ב־Mapeak"],
    ].filter(([, list]) => list.length);
    const linksHtml = linkRows.length ? `
      <div>
        <h3 class="section-title">קישורים</h3>
        <dl class="facts links">${linkRows.map(([k, list, label]) => `<dt>${esc(k)}</dt><dd>${linkList(list, label)}</dd>`).join("")}</dl>
      </div>` : "";

    $("detailView").innerHTML = `
      <button class="btn back" type="button" id="backBtn">→ כל האירועים</button>
      <div>
        <h2>${esc(ev.name)}</h2>
        <p class="when">${esc(when)}</p>
      </div>
      <div class="tags">${tags}</div>
      ${statsHtml}
      ${routesHtml}
      ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
      ${linksHtml}
      ${links || gpx ? `<div class="actions">${links}${gpx}</div>` : ""}`;

    $("backBtn").addEventListener("click", () => closeDetail(true));
    if (ev.routes.length) $("gpxBtn").addEventListener("click", () => downloadGpx(ev));
    $("detailView").querySelectorAll(".route").forEach((b) => {
      b.addEventListener("click", () => focusRoute(+b.dataset.k, true));
      b.addEventListener("mouseenter", () => ev.lines[+b.dataset.k] && ev.lines[+b.dataset.k].line.setStyle({ weight: 7 }));
      b.addEventListener("mouseleave", () => styleRoutes());
    });
    $("detailView").querySelectorAll(".route-gpx").forEach((b) => b.addEventListener("click", () => downloadGpx(ev, +b.dataset.gpx)));
  }

  // Picking a route of the event puts it in front and fades the others; picking it again shows all
  function focusRoute(k, zoom) {
    const ev = state.selected;
    if (!ev || !ev.routes[k]) return;
    const again = state.picked && state.focus === k;
    state.focus = k;
    state.picked = !again && ev.routes.length > 1;
    $("detailView").querySelectorAll(".route").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.k === k && (state.picked || !ev.multiDay))));
    styleRoutes();
    if (zoom && ev.routes.length > 1) map.flyToBounds(again ? ev.bounds : ev.lines[k].line.getBounds(), { ...fitPadding(), maxZoom: 15, duration: 0.5 });
    drawProfile();
  }

  // Room for the profile card, which floats over the bottom of the map on wide screens
  function fitPadding() {
    const card = $("profile");
    const overlay = !card.hidden && getComputedStyle(card).position === "absolute";
    return { paddingTopLeft: [40, 40], paddingBottomRight: [40, overlay ? card.offsetHeight + 60 : 40] };
  }

  // ── Elevation profile ───────────────────────────────────────────────────
  let profileSeries = null;
  function showProfile(ev) {
    if (!ev.routes.length) { hideProfile(); return; }
    $("profile").hidden = false;
    $("mapcol").classList.add("has-profile");
    map.invalidateSize();
    drawProfile();
  }
  function hideProfile() {
    $("profile").hidden = true;
    $("mapcol").classList.remove("has-profile");
    map.removeLayer(hoverDot);
    map.invalidateSize();
    profileSeries = null;
  }

  function drawProfile() {
    const ev = state.selected;
    const svg = $("profileSvg");
    if (!ev || !ev.routes.length || $("profile").hidden) return;
    const W = svg.clientWidth || 600, H = 150;
    const m = { l: 44, r: 10, t: 20, b: 22 };
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

    // Multi-day: one continuous line, day after day. Otherwise: each route from 0.
    const concat = ev.multiDay && ev.routes.length > 1;
    const series = [];
    let offset = 0;
    ev.routes.forEach((r, k) => {
      series.push({ r, k, off: concat ? offset : 0 });
      offset += r.km;
    });
    const xMax = concat ? offset : Math.max(...ev.routes.map((r) => r.km));
    let yMin = Infinity, yMax = -Infinity;
    ev.routes.forEach((r) => r.pts.forEach((p) => { if (p[2] < yMin) yMin = p[2]; if (p[2] > yMax) yMax = p[2]; }));
    if (yMax - yMin < 40) { const mid = (yMax + yMin) / 2; yMin = mid - 20; yMax = mid + 20; }
    const yStep = niceStep(yMax - yMin, 4);
    yMin = Math.floor(yMin / yStep) * yStep;
    yMax = Math.ceil(yMax / yStep) * yStep;
    const X = (km) => m.l + (km / (xMax || 1)) * (W - m.l - m.r);
    const Y = (z) => m.t + (1 - (z - yMin) / (yMax - yMin || 1)) * (H - m.t - m.b);

    let out = "";
    for (let z = yMin; z <= yMax + 1e-6; z += yStep) {
      out += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(z)}" y2="${Y(z)}"/><text x="${m.l - 6}" y="${Y(z) + 4}" text-anchor="end">${fmtM(z)}</text>`;
    }
    out += `<text x="${m.l - 6}" y="${m.t - 9}" text-anchor="end">מ׳</text>`;
    const xStep = niceStep(xMax, Math.max(3, Math.floor(W / 90)));
    for (let x = 0; x <= xMax + 1e-6; x += xStep) {
      out += `<text x="${X(x)}" y="${H - 6}" text-anchor="${x === 0 ? "start" : "middle"}">${fmtM(x)}</text>`;
    }
    out += `<text x="${m.l - 6}" y="${H - 6}" text-anchor="end">ק״מ</text>`;

    const order = series.slice().sort((a, b) => (a.k === state.focus) - (b.k === state.focus));
    order.forEach(({ r, k, off }) => {
      let d = "";
      for (let i = 0; i < r.pts.length; i++) d += (i ? "L" : "M") + X(off + r.cum[i]).toFixed(1) + "," + Y(r.pts[i][2]).toFixed(1);
      const focused = concat ? !state.picked || k === state.focus : k === state.focus;
      if (concat || ev.routes.length === 1) {
        out += `<path d="${d}L${X(off + r.km).toFixed(1)},${Y(yMin)}L${X(off).toFixed(1)},${Y(yMin)}Z" fill="${r.color}" fill-opacity="${focused ? 0.16 : 0.06}"/>`;
      }
      out += `<path d="${d}" fill="none" stroke="${r.color}" stroke-width="${focused ? 2 : 1.4}" stroke-opacity="${focused ? 1 : 0.55}" stroke-linejoin="round"/>`;
      if (concat && k > 0) {
        out += `<line class="sep" x1="${X(off)}" x2="${X(off)}" y1="${m.t}" y2="${H - m.b}"/>`;
      }
    });
    out += `<line class="guide" id="pGuide" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" visibility="hidden"/>`;
    out += `<circle id="pDot" r="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2" visibility="hidden"/>`;
    out += `<rect id="pHit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/>`;
    svg.innerHTML = out;

    $("profileTitle").textContent = concat ? "גובה לאורך כל ימי האירוע" : ev.routes.length > 1 ? `גובה לאורך ${ev.routes[state.focus].name}` : "גובה לאורך המסלול";
    profileSeries = { series, concat, X, Y, xMax, m, W };
    $("readout").textContent = "";

    const hit = $("pHit");
    const move = (e) => {
      const rect = svg.getBoundingClientRect();
      const px = ((e.clientX - rect.left) / rect.width) * W;
      const km = Math.max(0, Math.min(xMax, ((px - m.l) / (W - m.l - m.r)) * xMax));
      profileAt(km);
    };
    hit.addEventListener("pointermove", move);
    hit.addEventListener("pointerdown", move);
    hit.addEventListener("pointerleave", () => {
      $("pGuide").setAttribute("visibility", "hidden");
      $("pDot").setAttribute("visibility", "hidden");
      $("readout").textContent = "";
      map.removeLayer(hoverDot);
    });
  }

  function profileAt(km) {
    const ps = profileSeries;
    if (!ps) return;
    let s = ps.series[state.focus] || ps.series[0];
    if (ps.concat) s = ps.series.slice().reverse().find((x) => km >= x.off) || ps.series[0];
    const local = Math.min(Math.max(km - s.off, 0), s.r.km);
    const cum = s.r.cum;
    let lo = 0, hi = cum.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < local) lo = mid + 1; else hi = mid; }
    const p = s.r.pts[lo];
    const x = ps.X(s.off + cum[lo]), y = ps.Y(p[2]);
    $("pGuide").setAttribute("x1", x); $("pGuide").setAttribute("x2", x); $("pGuide").setAttribute("visibility", "visible");
    $("pDot").setAttribute("cx", x); $("pDot").setAttribute("cy", y); $("pDot").setAttribute("visibility", "visible");
    $("readout").textContent = `${fmtKm(s.off + cum[lo])} ק״מ · ${fmtM(p[2])} מ׳` + (ps.series.length > 1 ? ` · ${s.r.name}` : "");
    hoverDot.setLatLng([p[0], p[1]]);
    if (!map.hasLayer(hoverDot)) hoverDot.addTo(map);
  }

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { map.invalidateSize(); drawProfile(); layoutLabels(); }, 150);
  });

  // ── GPX download ────────────────────────────────────────────────────────
  // The whole event, or only one of its routes
  function downloadGpx(ev, only) {
    const x = (s) => String(s).replace(/[<>&"']/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;", "'": "&apos;" }[c]));
    const parts = [
      '<?xml version="1.0" encoding="UTF-8"?>',
      '<gpx version="1.1" creator="Bartali events map" xmlns="http://www.topografix.com/GPX/1/1">',
      `<metadata><name>${x(ev.name)}</name></metadata>`,
    ];
    (only == null ? ev.routes : [ev.routes[only]]).forEach((r) => {
      parts.push(`<trk><name>${x(r.name)}</name><trkseg>`);
      r.pts.forEach((p) => parts.push(`<trkpt lat="${p[0]}" lon="${p[1]}"><ele>${p[2]}</ele></trkpt>`));
      parts.push("</trkseg></trk>");
    });
    parts.push("</gpx>");
    const blob = new Blob([parts.join("\n")], { type: "application/gpx+xml" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (ev.name + (only == null ? "" : " - " + ev.routes[only].name)).replace(/[\\/:*?"<>|]+/g, " ").trim() + ".gpx";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  // ── Routing by #hash ────────────────────────────────────────────────────
  const hashOf = (ev) => "#" + encodeURIComponent(ev.slug);
  function fromHash() {
    let key = location.hash.slice(1);
    try { key = decodeURIComponent(key); } catch (e) { /* keep it as it is */ }
    const ev = key && (state.events.find((e) => e.slug === key) || state.events.find((e) => e.oldSlug === key));
    // A link in the old form (#e-…) opens the event, and the address switches to the Submission ID
    if (ev && key !== ev.slug) {
      try { history.replaceState(null, "", location.pathname + location.search + hashOf(ev)); } catch (e) { /* the address can't change here */ }
    }
    if (ev) select(ev, false); else closeDetail(false);
  }
  window.addEventListener("popstate", fromHash);

  // The open event is kept in the address (#<Submission ID>) so a link to it can be shared.
  // Some previews, like a file opened inside an app, don't allow that; the page works without it.
  function setAddress(url) {
    try { history.pushState(null, "", url); } catch (e) { /* the address can't change here */ }
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.selected) closeDetail(true); });

  // ── Light / dark switch ─────────────────────────────────────────────────
  const themeBtn = $("themeBtn");
  function showThemeButton() {
    const dark = activeTheme() === "dark";
    const label = dark ? "מעבר למצב בהיר" : "מעבר למצב כהה";
    themeBtn.setAttribute("aria-pressed", String(dark));
    themeBtn.setAttribute("aria-label", label);
    themeBtn.title = label;
  }
  themeBtn.addEventListener("click", () => {
    const next = activeTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("bartali-theme", next); } catch (e) { /* the choice lasts until the page is closed */ }
    showThemeButton();
    themeChanged();
  });
  if (deviceDark.addEventListener) deviceDark.addEventListener("change", () => { showThemeButton(); themeChanged(); });
  showThemeButton();
  // The regions map and the routes take their colors from the theme
  function themeChanged() {
    styleGeography();
    styleRegions();
    styleRoutes();
    showFocus();
  }

  // ── Boot ────────────────────────────────────────────────────────────────
  // The events are read from the Google Sheet (through the Apps Script Web app) on every visit.
  async function loadData() {
    if (!DATA_URL) throw Object.assign(new Error("DATA_URL is empty"), { notConnected: true });
    // Wait up to 25 seconds for the sheet to answer
    const stop = typeof AbortController === "function" ? new AbortController() : null;
    const timer = setTimeout(() => stop && stop.abort(), 25000);
    try {
      const res = await fetch(DATA_URL, { cache: "no-store", signal: stop ? stop.signal : undefined });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!data || !Array.isArray(data.events)) throw new Error("Unexpected answer from the sheet");
      return data;
    } finally {
      clearTimeout(timer);
    }
  }

  function showLoadProblem(err) {
    console.error("The events could not be loaded:", err);
    $("summary").textContent = "";
    const notice = $("notice");
    notice.hidden = false;
    if (err && err.notConnected) {
      notice.textContent = "האתר עוד לא מחובר לגיליון: צריך להדביק את כתובת ה־Web app של הגיליון בהגדרה DATA_URL בקובץ.";
      return;
    }
    notice.innerHTML = 'לא הצלחנו לטעון את האירועים מהגיליון. <button type="button" class="linkbtn" id="retryBtn">נסו שוב</button>';
    $("retryBtn").addEventListener("click", () => location.reload());
  }

  $("summary").textContent = "טוען אירועים מהגיליון…";
  // The regions map shows right away; the events fill it in when the sheet answers
  const geography = loadGeography()
    .then((gj) => { useGeography(gj); drawGeography(); styleGeography(); })
    .catch((e) => { console.error("The regions could not be drawn:", e); REGIONS = []; regionById = {}; })
    .then(() => { setView("regions"); styleRegions(); });
  Promise.all([loadData(), geography]).then(([data]) => {
    state.events = prepare(data);
    const withStats = state.events.filter((e) => e.stats);
    const kmMax = Math.ceil(Math.max(1, ...withStats.map((e) => e.stats.km)));
    const upMax = Math.ceil(Math.max(50, ...withStats.map((e) => e.stats.up)) / 50) * 50;
    state.bounds = { km: [0, kmMax], up: [0, upMax] };
    state.f = freshFilters();
    state.events.forEach(buildLayers);
    setupFilters();
    apply(false);

    const gen = data.generated ? new Date(data.generated) : null;
    $("foot").innerHTML = `${gen ? "הנתונים עודכנו ב־" + esc(longDate.format(gen)) + " · " : ""}מפות: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · <a href="https://mapeak.com" target="_blank" rel="noopener">Mapeak</a> · Esri`;
    if (location.hash) fromHash();
  }).catch(showLoadProblem);
})();
</script>
</body>
</html>
